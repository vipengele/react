nodeLinker: node-modules

enableScripts: true

npmMinimalAgeGate: 0

# @tandiko packages publish to (and resolve from) GitHub Packages. Auth token
# comes from the environment (NODE_AUTH_TOKEN = GITHUB_TOKEN in CI); empty
# locally, which is fine for install/build — only publish needs it.
npmScopes:
  tandiko:
    npmRegistryServer: "https://npm.pkg.github.com"
    npmPublishRegistry: "https://npm.pkg.github.com"
    npmAuthToken: "${NODE_AUTH_TOKEN-}"
