# .bulwark.yml — this file is yours.
#
# gt scaffolded it and will never modify or delete it again; bulwark owns what
# goes in it.
#
# Everything else bulwark supports — per-language enablement, coverage
# tolerances, patch-coverage opt-outs, toolchain overrides — belongs here too.
# See bulwark's README.
typescript:
  # Biome rather than the default ESLint + eslint-plugin-security. That plugin's
  # detect-object-injection fires on every `obj[key]`, and .bulwark.yml has no
  # rule-level exclusion, so the only way to quiet it is a suppression at each
  # site. Biome's security + correctness sets carry their weight instead. This
  # matches the choice made across the governed repos (wardnet-design-system included).
  linter: biome

coverage:
  provider: v8
