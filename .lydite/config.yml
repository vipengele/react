licence:
  policy:
    allow: [Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MIT, Unicode-3.0]

typescript:
  # lydite's install detection runs `pnpm install --frozen-lockfile` at the
  # workspace root, but only components with a language get a provisioned pnpm
  # on PATH; storybook declares a raw command and has none, so its install
  # failed as "not prepared". The pinned version comes from `packageManager` in
  # source/react-ui/package.json (ADR-0015); npx fetches it, so this needs no
  # pnpm on PATH.
  install: npx --yes pnpm@12.4.1 install --frozen-lockfile
