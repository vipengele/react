# What lydite builds, tests, scans and gates in vipengele/react.
#
# Each project under source/ is its own pnpm workspace (ADR-0015): source/react-ui
# has one lockfile (pnpm-lock.yaml) and one Biome config (biome.json) covering its
# packages, but there is no single vitest entrypoint: turbo's `test`
# task fans out to each package's own `vitest run --coverage`, and no
# vitest.workspace.ts or root vitest.config.ts points a single component at
# it. A component is the unit its build tool treats as a whole, and here that
# unit is one workspace package — icons, tokens, ui and telemetry are each their
# own vitest invocation and their own component.
#
# storybook carries no test script — it is the tool itself, not something
# under test — so it does not fit a vitest component. Declaring it with a raw
# command rather than excluding it keeps it scanned and orphan-covered, with
# test and coverage reporting unmeasured instead of the tree going dark under
# it. The command opts it out of the derived plain/instrumented/build-only
# variants, so mutation — which needs all three — is turned off explicitly
# rather than run against a command with no suite behind it.
components:
  - name: icons
    dir: source/react-ui/packages/icons
    runner: vitest

  - name: tokens
    dir: source/react-ui/packages/tokens
    runner: vitest

  - name: ui
    dir: source/react-ui/packages/ui
    runner: vitest
    # ui imports @vipengele/react-tokens, @vipengele/react-icons and @vipengele/react-telemetry through their package.json
    # `exports`, which point at dist/ — turbo's own test task depends on
    # `^build` (turbo.json) so CI never runs a workspace package's test
    # before its workspace dependencies are built. lydite's vitest runner has
    # no such graph, so the build runs here instead.
    depends_on: [tokens, icons, telemetry]
    setup:
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-tokens run build'
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-icons run build'
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-telemetry run build'
      # This project's own Vitest config runs part of its suite under a real
      # Chromium instance, and playwright ships no postinstall hook to fetch
      # the browser itself. `setup:` runs after lydite's own coalesced
      # install, in this component's own directory, with the provisioned
      # pnpm on PATH — see `ci-test.yml`'s identical step for why this browser
      # is needed at all.
      - npx playwright install --with-deps chromium

  - name: telemetry
    dir: source/react-ui/packages/telemetry
    runner: vitest
    setup:
      # This package's own Vitest config runs part of its suite under a real
      # Chromium instance, and playwright ships no postinstall hook to fetch
      # the browser itself — see ui's `setup:` above.
      - npx playwright install --with-deps chromium

  - name: storybook
    dir: source/react-ui/apps/storybook
    command: ["pnpm", "run", "type-check"]
    mutation: false
    # storybook imports @vipengele/react-tokens, @vipengele/react-icons, @vipengele/react-ui
    # and @vipengele/react-telemetry through their package.json `exports`, which point at
    # dist/ — see ui's own comment above for why the build runs here rather than through turbo.
    depends_on: [tokens, icons, ui, telemetry]
    setup:
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-tokens run build'
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-icons run build'
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-ui run build'
      - sh -c 'cd "$(git rev-parse --show-toplevel)/source/react-ui" && pnpm --filter @vipengele/react-telemetry run build'

# Repo tooling that runs in a developer's or agent's session and has no suite or coverage
# to gate, so it belongs to no component. Globs are relative to the repository root.
excludes:
  - source/react-ui/scripts/**
