# pages-deploy — publishes the Storybook build to GitHub Pages.
#
# A STANDALONE workflow, not a gt cd-pipeline stage. .gt-repo.yaml sets
# pipeline.cd.enabled: false, and turning gt's CD pipeline on is a larger
# decision — it renders cd-* stages into ci-orchestration.yml and brings the
# release/attestation machinery with it — than publishing a docs site. gt neither
# renders nor reads this file; nothing here participates in ci-gate.
#
# Pages is not enabled on the repository (has_pages is false). The
# actions/configure-pages step below turns it on through the API on its first
# successful run, which is why there is no manual repository-settings step to
# perform first.
name: pages-deploy

on:
  # Only the default branch publishes. A pull request builds Storybook already,
  # in ci-build's `pnpm build`; deploying from one would overwrite the live site
  # with unmerged work.
  push:
    branches: [main]

# GitHub Pages accepts one deployment at a time. cancel-in-progress: false so a
# rapid second push queues behind the first rather than cancelling it — a
# cancelled deploy leaves the site on the previous commit with nothing to say so.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    # contents: read only. Installing dependencies and running the build in
    # the same job that holds pages:write/id-token:write would let a
    # compromised transitive dependency mint Pages deploys or OIDC tokens —
    # those scopes belong only to the deploy job below, which runs nothing
    # but the two Pages actions.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is never needed again after this step; leaving
          # it out of .git/config shrinks what a compromised build step could
          # do with it.
          persist-credentials: false
      # Installs the pnpm version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The root build. Turborepo orders @tandiko/tokens and @tandiko/icons ahead
      # of @tandiko/storybook, so no --filter is needed and adding one would only
      # risk dropping a dependency the site needs.
      - run: pnpm build

      # Enables Pages on first run and exports the base URL the site is served
      # from, which must happen before the artifact is uploaded. Needs no
      # extra permission itself — only the later deploy-pages call does.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Everything published is staged into _site first, so a second app can be
      # copied alongside Storybook with one more `cp` line and no change to the
      # upload step.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r apps/storybook/storybook-static/* _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    # Only this job touches the Pages API, and it runs nothing but
    # deploy-pages — no dependency install, no build, nothing that could turn
    # a compromised package into a forged deploy or a minted OIDC token.
    permissions:
      pages: write
      id-token: write
    # The URL the run reports back; deploy-pages emits it as an output.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
