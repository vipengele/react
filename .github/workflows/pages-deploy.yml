# pages-deploy — publishes the site at vipengele.github.io/react.
#
# The site is the shell in `.github-pages/` plus one subdirectory per project,
# each holding that project's `build:pages` output built from its LATEST RELEASE
# TAG rather than from the default branch. What the site demonstrates is
# therefore what is installable from npm, not what is merged.
#
# A Pages deployment replaces the whole site, so every release rebuilds every
# project: deploying one project alone would take the others offline. That is
# why this runs after any project's release, not just the released one's.
#
# A STANDALONE workflow, not a gt cd-pipeline stage. .gt-repo.yaml sets
# pipeline.cd.enabled: false, and turning gt's CD pipeline on is a larger
# decision — it renders cd-* stages into ci-orchestration.yml and brings the
# release/attestation machinery with it — than publishing a docs site. gt
# neither renders nor reads this file; nothing here participates in ci-gate.
#
# Pages is not enabled on the repository until the configure job below turns it
# on through the API on its first successful run, which is why there is no
# manual repository-settings step to perform first.
name: pages-deploy

on:
  # After a release, not on the tag push itself: the site announces released
  # versions, and a release whose publish failed is not one. `workflow_run`
  # always uses this file as it stands on the default branch, whatever ref the
  # release ran from.
  workflow_run:
    workflows: [release]
    types: [completed]
  # Redeploying without a release — a change to the shell, or a deployment to
  # repeat — is a manual act rather than a push trigger, because the site is
  # built from tags and pushing to the default branch changes nothing about it.
  workflow_dispatch:

# GitHub Pages accepts one deployment at a time. cancel-in-progress: false so a
# rapid second release queues behind the first rather than cancelling it — a
# cancelled deploy leaves the site on the previous commit with nothing to say so.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  configure:
    name: configure
    # A release that failed leaves nothing new to publish, and republishing the
    # previous state would be a deployment nobody asked for.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # The only job that calls the Pages API before deploy, and the only step it
    # runs is configure-pages — no checkout, no dependency install, nothing a
    # compromised package could ride to a Pages-settings change.
    permissions:
      pages: write
    steps:
      # Turns Pages on for this repo on the first successful run.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  detect:
    name: detect
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.releases.outputs.projects }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags are what this job reads; a shallow clone carries none of them.
          fetch-depth: 0
          persist-credentials: false

      # A project appears on the site once it has a release. One that has never
      # been tagged has no released version to show, and showing its default
      # branch instead would put unreleased components on a page whose whole
      # claim is that it shows what is installable.
      - name: The latest release tag of each project
        id: releases
        run: |
          set -euo pipefail
          projects='[]'
          for dir in source/*/; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            # Version sort, so 0.10.0 ranks above 0.9.0 rather than below it.
            # The glob is not the pattern a release tag has to match, and git's
            # version sort ranks a suffixed tag like `@v0.1.0-wip` ABOVE the
            # release it qualifies — so the list is narrowed to exactly what
            # release.yml accepts before the newest is taken. `|| true` because
            # a project with no matching tag is an ordinary outcome and `grep`
            # reports it as failure under `pipefail`.
            tag="$(git tag --list "${name}@v*" --sort=-v:refname \
              | grep -E "^${name}@v[0-9]+\.[0-9]+\.[0-9]+$" | head -n 1 || true)"
            if [ -z "$tag" ]; then
              echo "${name}: never released, leaving it off the site"
              continue
            fi
            # A tag from before the project grew a build:pages script cannot
            # contribute a site, and failing the deploy over it would take every
            # other project down with it.
            if ! git show "${tag}:source/${name}/package.json" | jq -e '.scripts["build:pages"]' > /dev/null 2>&1; then
              echo "::warning::${tag} has no build:pages script, leaving ${name} off the site"
              continue
            fi
            echo "${name}: ${tag}"
            projects="$(jq -c --arg name "$name" --arg tag "$tag" \
              '. + [{name: $name, tag: $tag, version: ($tag | sub("^.*@v"; ""))}]' <<< "$projects")"
          done
          echo "projects=${projects}" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.project.name }})
    needs: detect
    # An empty matrix is a workflow error, so a repository with no release yet
    # skips this job and publishes the shell alone.
    if: needs.detect.outputs.projects != '[]'
    runs-on: ubuntu-latest
    # contents: read only — no Pages scope at all. This job runs `pnpm install`
    # and a build, which execute every transitive dependency's own
    # install/build scripts; keeping the Pages API out of its reach entirely
    # (not even pages: read) is what the configure job above buys.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJSON(needs.detect.outputs.projects) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The released commit, not the default branch. Everything below — the
          # lockfile, the pinned pnpm, the build script — is read from the tag,
          # so the site is built by the toolchain that version shipped with.
          ref: ${{ matrix.project.tag }}
          # The checkout token is never needed again after this step; leaving it
          # out of .git/config shrinks what a compromised build step could do
          # with it.
          persist-credentials: false

      # Installs the pnpm version the project pins in its packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/${{ matrix.project.name }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/${{ matrix.project.name }}/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: source/${{ matrix.project.name }}
      - run: pnpm build:pages
        working-directory: source/${{ matrix.project.name }}

      - name: The build produced a site
        working-directory: source/${{ matrix.project.name }}
        run: |
          set -euo pipefail
          if [ ! -f pages-dist/index.html ]; then
            echo "::error::source/${{ matrix.project.name }}/pages-dist/index.html is missing after build:pages"
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pages-${{ matrix.project.name }}
          path: source/${{ matrix.project.name }}/pages-dist
          retention-days: 1

  assemble:
    name: assemble
    needs: [detect, build]
    # The shell publishes even when no project built, so the site exists from
    # the first deployment rather than from the first release. A build that
    # FAILED is different from one that was skipped: it would publish a site
    # missing a project that has a release, so it stops here.
    if: ${{ !cancelled() && needs.detect.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pages-*
          path: ${{ runner.temp }}/projects

      # The shell first, then each project into a subdirectory named after it,
      # so a project's own index.html lands at /<project>/ and the shell's at /.
      # projects.json is written from the artefacts that actually arrived, so
      # the landing page cannot link to a project the site does not carry.
      - name: Assemble the site
        env:
          PROJECTS: ${{ needs.detect.outputs.projects }}
          DOWNLOADS: ${{ runner.temp }}/projects
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -R .github-pages/. _site/

          published='[]'
          while IFS= read -r name; do
            [ -z "$name" ] && continue
            if [ ! -d "${DOWNLOADS}/pages-${name}" ]; then
              echo "::error::the ${name} build uploaded no artefact"
              exit 1
            fi
            mkdir -p "_site/${name}"
            cp -R "${DOWNLOADS}/pages-${name}/." "_site/${name}/"
            published="$(jq -c --arg name "$name" --argjson all "$PROJECTS" \
              '. + [$all[] | select(.name == $name) | {name, version}]' <<< "$published")"
            echo "assembled ${name}"
          done < <(jq -r '.[].name' <<< "$PROJECTS")

          jq -n --argjson published "$published" '$published' > _site/projects.json
          cat _site/projects.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: [configure, assemble]
    runs-on: ubuntu-latest
    # The only job holding id-token: write, and it runs nothing but
    # deploy-pages — no dependency install, no build, nothing that could turn a
    # compromised package into a minted OIDC token.
    permissions:
      pages: write
      id-token: write
    # The URL the run reports back; deploy-pages emits it as an output.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
