# pages-deploy — publishes the Storybook build to GitHub Pages.
#
# A STANDALONE workflow, not a gt cd-pipeline stage. .gt-repo.yaml sets
# pipeline.cd.enabled: false, and turning gt's CD pipeline on is a larger
# decision — it renders cd-* stages into ci-orchestration.yml and brings the
# release/attestation machinery with it — than publishing a docs site. gt neither
# renders nor reads this file; nothing here participates in ci-gate.
#
# Pages is not enabled on the repository (has_pages is false). The
# actions/configure-pages step below turns it on through the API on its first
# successful run, which is why there is no manual repository-settings step to
# perform first.
name: pages-deploy

on:
  # Only the default branch publishes. A pull request builds Storybook already,
  # in ci-build's `pnpm build`; deploying from one would overwrite the live site
  # with unmerged work.
  push:
    branches: [main]

# GitHub Pages accepts one deployment at a time. cancel-in-progress: false so a
# rapid second push queues behind the first rather than cancelling it — a
# cancelled deploy leaves the site on the previous commit with nothing to say so.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  configure:
    name: configure
    runs-on: ubuntu-latest
    # The only job that calls the Pages API before deploy, and the only
    # step it runs is configure-pages — no checkout, no dependency install,
    # nothing a compromised package could ride to a Pages-settings change.
    permissions:
      pages: write
    steps:
      # Turns Pages on for this repo on the first successful run.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

  build:
    name: build
    runs-on: ubuntu-latest
    # contents: read only — no Pages scope at all. This job runs `pnpm
    # install` and `pnpm build`, which execute every transitive dependency's
    # own install/build scripts; keeping the Pages API out of its reach
    # entirely (not even pages: read) is what the configure job above buys.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The checkout token is never needed again after this step; leaving
          # it out of .git/config shrinks what a compromised build step could
          # do with it.
          persist-credentials: false
      # Installs the pnpm version the project pins in its packageManager field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/react-ui/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/react-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source/react-ui
      # The project build. Turborepo orders @vipengele/react-tokens and @vipengele/react-icons ahead
      # of @vipengele/react-storybook, so no --filter is needed and adding one would only
      # risk dropping a dependency the site needs.
      - run: pnpm build
        working-directory: source/react-ui

      # Everything published is staged into _site first, so a second app can be
      # copied alongside Storybook with one more `cp` line and no change to the
      # upload step.
      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site
          cp -r source/react-ui/apps/storybook/storybook-static/* _site/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: deploy
    needs: [configure, build]
    runs-on: ubuntu-latest
    # The only job holding id-token: write, and it runs nothing but
    # deploy-pages — no dependency install, no build, nothing that could turn
    # a compromised package into a minted OIDC token.
    permissions:
      pages: write
      id-token: write
    # The URL the run reports back; deploy-pages emits it as an output.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
