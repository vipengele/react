# ci-build — this file is yours.
#
# gt created it once and will never modify or delete it again. Put this
# repository's build steps here; the orchestration around it stays gt's.
#
# Biome gates the tree first — it is both linter and formatter here, and the
# two run before the build so a style failure costs seconds rather than a full
# turbo graph. turbo then builds every workspace (for @tandiko/brand:
# re-outlining assets/src into assets/dist), then type-checks.
#
# The stages are gt's: adding one means editing .gt-repo.yaml, so a check that
# needs no stage of its own lives here as a step.
#
# Running the suite is ci-test's job — it uploads a gt-coverage artifact the
# bulwark stage reads instead of running everything a second time
# (.bulwark.yml: coverage.source: report).
#
# It is called by ci-orchestration.yml and must keep `workflow_call`, or the
# orchestrator loses the stage.
name: ci-build

on:
  workflow_call:

# A called workflow may only ever NARROW what its caller grants, never widen
# it — so this block is a ceiling on the whole stage, not a floor. Two
# consequences worth knowing before editing it:
#
#   * packages: read matches the orchestrator's baseline. Dropping it here
#     breaks any step resolving a private @scope dependency, and the failure
#     names the registry rather than this file.
#   * A stage widened via pipeline.{ci,cd}.stage_permissions still has to
#     declare the extra scope HERE too. Granting security-events: write in the
#     spec and leaving this at contents: read means the SARIF upload silently
#     stops publishing — the caller offered the scope and the leaf declined it.
permissions:
  contents: read
  packages: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Installs the pnpm version pinned by packageManager in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `--error-on-warnings` (in the lint script) makes a warning fatal, so a
      # rule that only warns is dealt with instead of accumulating unread.
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm build
      # The committed dist/ must be exactly what the sources build to. A src/
      # edit merged without rebuilding would otherwise ship stale vectors.
      - name: Outlined SVGs are up to date
        run: git diff --exit-code -- packages/brand/assets/dist
      - run: pnpm type-check
