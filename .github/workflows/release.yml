# release — publishes one project's packages to npm.
#
# A human pushes the tag; nothing else starts this. The tag is the decision and
# the only input: `<project>@vX.Y.Z` names both what is released and at which
# version, and every non-private package in `source/<project>` is published at
# that version (ADR-0015). One workflow serves every project, because the
# project name is read from the tag rather than written into a file here.
#
# Three jobs, and the seams between them are safety properties. `tag` reads the
# repository and decides whether this is a release at all. `build` holds no
# credentials: it installs dependencies — which runs third-party lifecycle
# scripts — and builds, then hands `dist/` on as an artefact. `publish` holds
# the OIDC token and publishes exactly the artefact it was handed, after
# checking that the artefact carries nothing but the `dist/` directories it is
# supposed to.
#
# Publishing is npm trusted publishing: npm exchanges this workflow's OIDC token
# for a short-lived credential, so no npm secret exists in this repository. A
# publisher is enrolled per package name, and npm can only enrol one on a name
# the registry already holds — so each name is created by a one-time manual
# publish before its publisher can exist.
name: release

on:
  push:
    # A tag filter is a glob, not a regex: `*` matches any run of characters
    # without a `/`, and `+` means one or more of what precedes it. It is the
    # coarse gate — the `tag` job below applies the real pattern and fails a tag
    # that only looks like a release.
    tags: ['*@v[0-9]+.[0-9]+.[0-9]+']

# Read-only by default; the publish job widens this to exactly what it publishes
# with.
permissions:
  contents: read

# One release at a time per tag, and never cancel one in flight: a cancelled run
# leaves some of a project's packages published and the rest not.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag
    runs-on: ubuntu-latest
    outputs:
      project: ${{ steps.parse.outputs.project }}
      version: ${{ steps.parse.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Everything that can fail without leaving anything half-published fails
      # here: a tag naming no project, and missing release notes. The GitHub
      # Release body is a file a human wrote and reviewed, so a run that reaches
      # npm before discovering it is absent has published a version whose notes
      # nobody can produce.
      - name: The tag names a project and carries its notes
        id: parse
        run: |
          set -euo pipefail
          if [[ ! "${GITHUB_REF_NAME}" =~ ^([a-z0-9-]+)@v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::${GITHUB_REF_NAME} is not <project>@vX.Y.Z"
            exit 1
          fi
          project="${BASH_REMATCH[1]}"
          version="${BASH_REMATCH[2]}"

          if [ ! -d "source/${project}" ]; then
            echo "::error::${GITHUB_REF_NAME} names project '${project}', and source/${project} does not exist"
            exit 1
          fi

          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::$notes is missing — write the notes for ${GITHUB_REF_NAME} before tagging"
            exit 1
          fi

          echo "project=${project}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "releasing ${project} at ${version}"

  build:
    name: build
    needs: tag
    runs-on: ubuntu-latest
    permissions:
      # A job-level block REPLACES the workflow default rather than narrowing
      # it, so read is stated here rather than inherited. This job reads the
      # repository and writes nothing anywhere.
      contents: read
    defaults:
      run:
        working-directory: source/${{ needs.tag.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `pnpm install` below runs postinstall scripts from the dependency
          # tree, and a token left in .git/config is a token they can read.
          # Nothing in this job talks to git over the network.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/${{ needs.tag.outputs.project }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/${{ needs.tag.outputs.project }}/pnpm-lock.yaml

      # ADR-0015: one tag sets one version across the project. npm publishes
      # whatever the manifests say while the GitHub Release takes the tag, so a
      # tag ahead of the manifests ships artefacts that disagree about which
      # version they are.
      #
      # The package set is the one the publish job selects — every non-private
      # workspace project — read the same way, so a package added to the
      # workspace is checked here because it is published there.
      - name: The manifests carry the tag's version
        env:
          WANT: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          packages="$(pnpm list --recursive --depth -1 --json)"
          # A selection that matches nothing would pass this check vacuously.
          count="$(jq -r '[.[] | select(.private == false)] | length' <<< "$packages")"
          if [ "$count" -eq 0 ]; then
            echo "::error::no publishable package was found in this project"
            exit 1
          fi
          wrong="$(jq -r --arg want "$WANT" \
            '.[] | select(.private == false) | select(.version != $want) | "  \(.name) is \(.version)"' \
            <<< "$packages")"
          if [ -n "$wrong" ]; then
            echo "::error::${GITHUB_REF_NAME} names version ${WANT}, which not every package carries"
            echo "$wrong"
            exit 1
          fi
          echo "$count package(s) at ${WANT}"

      - run: pnpm install --frozen-lockfile

      # Every package publishes `files: ["dist"]`, so the whole project is
      # built — a package whose dist/ is absent publishes an empty tarball.
      - run: pnpm build

      # Staged under one directory whose contents mirror the repository from its
      # root. Listing the dist/ paths on the upload directly would make
      # upload-artifact root the archive at their common ancestor, stripping the
      # prefix each path needs to land back where the publish job expects it.
      - name: Stage dist/ for the publish job
        working-directory: .
        env:
          STAGE: ${{ runner.temp }}/release-dist
          PROJECT: ${{ needs.tag.outputs.project }}
        run: |
          set -euo pipefail
          # A list read inside a process substitution takes its failure with it:
          # `pnpm list` or `jq` falling over leaves a loop that runs zero times
          # and a step that passes having staged nothing.
          packages="$(pnpm --dir "source/${PROJECT}" list --recursive --depth -1 --json | jq -r '.[] | select(.private == false) | .path')"
          if [ -z "$packages" ]; then
            echo "::error::no publishable package was found in this project"
            exit 1
          fi
          # The stage carries exactly this step's output. Anything an earlier
          # step left under it is a file the publish job would be handed.
          rm -rf "${STAGE}"
          while IFS= read -r package; do
            relative="${package#"${GITHUB_WORKSPACE}/"}"
            if [ ! -d "${relative}/dist" ]; then
              echo "::error::${relative}/dist is missing — the build produced no output for it"
              exit 1
            fi
            mkdir -p "${STAGE}/${relative}"
            cp -R "${relative}/dist" "${STAGE}/${relative}/dist"
            echo "staged ${relative}/dist"
          done <<< "$packages"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: ${{ runner.temp }}/release-dist

  publish:
    name: publish
    needs: [tag, build]
    runs-on: ubuntu-latest
    permissions:
      # Creating the GitHub Release, and nothing wider.
      contents: write
      # npm exchanges this OIDC token for a short-lived publish credential and
      # attaches the provenance attestation. Without it `--provenance` has
      # nothing to sign.
      id-token: write
    # The environment is what limits which refs reach these credentials, and it
    # is part of what npm checks: a trusted publisher names the environment
    # alongside the repository and this file, so a publish from anywhere else is
    # refused rather than merely unreviewed.
    #
    # Without it the binding is owner, repository and filename only — and a run
    # uses the workflow file from the ref that triggered it, so pushing a branch
    # that widens the trigger would publish with valid provenance, past review
    # and past the checks this workflow does not repeat.
    environment:
      name: npm-release
    defaults:
      run:
        working-directory: source/${{ needs.tag.outputs.project }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `gh` reads GH_TOKEN, so nothing here needs the checkout credential —
          # and a credential in .git/config is one every subprocess inherits.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: source/${{ needs.tag.outputs.project }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: source/${{ needs.tag.outputs.project }}/pnpm-lock.yaml
          # Writes the .npmrc registry line the publish resolves against. Node
          # 24 ships an npm new enough to perform the OIDC exchange for trusted
          # publishing.
          registry-url: https://registry.npmjs.org

      # `pnpm publish` rewrites `workspace:*` into the real version by reading
      # the installed dependency, and refuses to pack without it. Scripts stay
      # off: this job builds nothing, and the credentials it holds are the ones
      # a dependency's postinstall must never see.
      - run: pnpm install --frozen-lockfile --ignore-scripts

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          # Unpacked into a directory of its own, never over the checkout. The
          # build job runs third-party lifecycle scripts, so a file the archive
          # carries is a file one of them may have written — and a manifest
          # expanded over the checkout is the manifest this job publishes, with
          # whatever `prepublishOnly` it names.
          path: ${{ runner.temp }}/release-dist

      # The manifests that are published come from this job's checkout, and the
      # only thing the build job contributes is dist/.
      #
      # Which directories those are is read from the checkout too, so the
      # archive cannot name the places it is allowed to land; anything it
      # carries outside them ends the release here rather than reaching a
      # package. `--provenance` signs whatever is packed, so a tarball built
      # from a file this job did not verify would carry an attestation saying it
      # came from this commit.
      - name: Only dist/ crosses from the build job
        working-directory: .
        env:
          STAGE: ${{ runner.temp }}/release-dist
          PROJECT: ${{ needs.tag.outputs.project }}
        run: |
          set -euo pipefail
          packages="$(pnpm --dir "source/${PROJECT}" list --recursive --depth -1 --json | jq -r '.[] | select(.private == false) | .path')"
          if [ -z "$packages" ]; then
            echo "::error::no publishable package was found in this project"
            exit 1
          fi

          allowed=()
          while IFS= read -r package; do
            relative="${package#"${GITHUB_WORKSPACE}/"}"
            if [ ! -d "${STAGE}/${relative}/dist" ]; then
              echo "::error::${relative}/dist is missing from the build artefact"
              exit 1
            fi
            allowed+=("${relative}/dist/")
          done <<< "$packages"

          # Directories are ignored: an empty one carries nothing. A symlink is
          # not a directory to `find`, so one planted outside a dist/ is caught
          # here rather than followed by the copy below.
          carried="$(cd "${STAGE}" && find . ! -type d | sed 's|^\./||' | sort)"
          stray=""
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            inside=""
            for prefix in "${allowed[@]}"; do
              case "$entry" in "${prefix}"*) inside=yes; break ;; esac
            done
            if [ -z "$inside" ]; then
              stray="${stray}  ${entry}"$'\n'
            fi
          done <<< "$carried"
          if [ -n "$stray" ]; then
            echo "::error::the build artefact carries files outside the packages' dist/ directories"
            printf '%s' "$stray"
            exit 1
          fi

          while IFS= read -r package; do
            relative="${package#"${GITHUB_WORKSPACE}/"}"
            rm -rf "${relative}/dist"
            cp -R "${STAGE}/${relative}/dist" "${relative}/dist"
            echo "restored ${relative}/dist"
          done <<< "$packages"

      # The package set is every non-private package of this project, read from
      # this job's checkout the same way the steps above read it, so a package
      # added to the workspace is carried along rather than missed by a list
      # kept by hand. pnpm orders the selection topologically, so a package
      # publishes after the ones it depends on.
      #
      # A published version is immutable: npm answers [E403] to a second PUT of
      # a version it already holds, and one tag push can produce more than one
      # run. So each name is probed against the registry's version endpoint —
      # 200 published, 404 not — and only the absent ones are published. A
      # re-run, or the second of two runs from one push, finishes what is
      # missing rather than failing on what landed, and a run with nothing left
      # to do succeeds.
      #
      # Any other answer is fatal. A probe that cannot say whether a version
      # exists leaves publishing a guess, and a guess is how a partial publish
      # becomes one nobody can read.
      #
      # --access public is redundant with each manifest's publishConfig, and is
      # passed anyway so a scoped package added without that field publishes
      # public rather than failing as restricted.
      #
      # --ignore-scripts because everything a package ships is built in the job
      # that holds no credentials. No manifest here names a publish lifecycle
      # script, so nothing is suppressed — and a package that later wants one
      # gains a step that would run with the OIDC exchange in scope, which is a
      # decision to take deliberately rather than inherit.
      - name: Publish to npm
        env:
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          set -euo pipefail
          packages="$(pnpm list --recursive --depth -1 --json | jq -r '.[] | select(.private == false) | .name')"
          if [ -z "$packages" ]; then
            echo "::error::no publishable package was found in this project"
            exit 1
          fi

          filters=()
          while IFS= read -r name; do
            # The scope's slash is a path separator to the registry, so it is
            # encoded: @vipengele/react-ui is asked for as @vipengele%2Freact-ui.
            # A transport failure writes 000 rather than a status, which is
            # neither 200 nor 404 and ends the release below.
            status="$(curl --silent --show-error --output /dev/null \
              --write-out '%{http_code}' \
              "https://registry.npmjs.org/${name//\//%2F}/${VERSION}" || true)"
            case "$status" in
              200) echo "${name}@${VERSION} is on the registry already" ;;
              404) filters+=(--filter "$name") ;;
              *)
                echo "::error::the registry answered ${status} for ${name}@${VERSION} — whether it is published is unknown"
                exit 1
                ;;
            esac
          done <<< "$packages"

          if [ "${#filters[@]}" -eq 0 ]; then
            echo "every package is on the registry at ${VERSION}; nothing to publish"
            exit 0
          fi

          pnpm "${filters[@]}" publish --provenance --access public --no-git-checks --ignore-scripts

      # Last, because it is the announcement: it exists once the version it
      # announces is installable from npm.
      #
      # `gh release create` fails on a version that already has a GitHub
      # Release, which would strand every re-run after a partial publish at the
      # step before the one that needs to finish. Writing the notes through
      # `edit` when one exists converges instead.
      - name: Announce the GitHub Release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="docs/release-notes/${GITHUB_REF_NAME}.md"
          if gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file "$notes" --draft=false
          else
            gh release create "${GITHUB_REF_NAME}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes-file "$notes"
          fi
